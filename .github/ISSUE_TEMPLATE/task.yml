name: 작업 요청
description: 기능 추가, 개선, 문서 작업의 범위와 완료 조건
title: "[Task] "
body:
  - type: textarea
    id: context
    attributes:
      label: 배경과 목표
      description: 어떤 문제를 해결하며 왜 필요한가요?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 이번에 할 일과 하지 않을 일을 구분하세요.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 확인 가능한 결과와 테스트 기준을 적어 주세요.
      placeholder: "- [ ] 검증 조건"
    validations:
      required: true
  - type: textarea
    id: coordination
    attributes:
      label: 담당자 및 의존성
      description: 담당자는 Assignees에도 지정하고, 선행 작업이나 관련 이슈를 연결하세요.
